name = "bip110"
compatibility_date = "2025-01-26"
main = "./src/worker.ts"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "SIGNALING_MINER_HISTORY"
class_name = "SignalingMinerHistory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingMinerHistory"]

[triggers]
crons = ["*/5 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = [
  "/api/monitor",
  "/api/monitor-blocks",
  "/monitor",
  "/monitor/",
  "/og/monitor.png",
  "/ursf-monitor",
  "/ursf-monitor/",
]
